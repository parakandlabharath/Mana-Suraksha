name: Core Java CI

on:
  push:
    paths:
      - 'core-java/**'
      - '.github/workflows/core-java.yml'
  pull_request:
    paths:
      - 'core-java/**'
      - '.github/workflows/core-java.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run Core Java tests
        run: mvn -B test
        working-directory: core-java
