name: Maven CI

on:
  push:
    paths:
      - 'pom.xml'
      - 'core-java/**'
      - 'backend/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'pom.xml'
      - 'core-java/**'
      - 'backend/**'
      - '.github/workflows/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build all modules and run tests
        run: mvn -B test
